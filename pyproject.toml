[project]
name = "coach"
version = "0.1.0"
description = "Personalised RAG-based application for personalised coaching. Integrated with the Strava API to be always up to date with your latest progress."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "chainlit>=2.10.0",
    "fastapi>=0.135.1",
    "google-genai>=1.66.0",
    "more-itertools>=10.8.0",
    "openai>=2.15.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "supabase>=2.28.0",
    "ty>=0.0.15",
    "types-requests>=2.32.4.20260107",
    "uvicorn>=0.42.0",
]

[tool.uv]
package = true

[tool.mypy]
no_implicit_reexport = true
no_error_summary = true
local_partial_types = true
disallow_untyped_defs = true
strict = true
no_warn_return_any = true
disallow_any_generics = false
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["coach.web.chainlit_app", "coach.web.coaching", "coach.web.google_oauth", "coach.web.profile_flow", "coach.web.session"]
disallow_untyped_calls = false

[tool.ruff]
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "examples",
]
line-length = 200
target-version = "py313"

[tool.ruff.lint]
preview = true
ignore = [
    "ANN401", # Dynamically typed expressions (typing.Any) are disallowed
    "UP007", # Use `X | Y` for type annotations (triggers on Optional[])
    "UP045", # Allow Optional[]
    "SIM108", # Do not force ternary operator
]

select = [
    'A', # flake8-builtins
    'B', # flake8-bugbear
    'BLE', # flake8-blind-except
    'C4', # flake8-comprehensions
    'C90', # mccabe
    'COM', # flake8-commas
    'DTZ', # flake8-datetimez
    'E', # pycodestyle / Error
    'ERA', # eradicate
    'F', # Pyflakes
    'I', # isort
    'N', # pep8-naming
    'NPY', # NumPy-specific rules
    'PIE', # flake8-pie
    'PT', # flake8-pytest-style
    'PTH', # flake8-use-pathlib
    'S', # flake8-bandit
    'SIM', # flake8-simplify
    'TID', # flake8-tidy-imports
    'UP', # pyupgrade
    'W', # pycodestyle / Warning
    'ANN', # function typing
    'Q001', # single quotes
]

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["S101", "S105", "S106", "S107"]  # Allow asserts and hardcoded test credential strings
"src/auto_featurs/base/tests/test_column_specification.py" = ["SIM300"]  # Allow yoda conditions to test AND/OR/INVERT operators

[dependency-groups]
dev = [
    "freezegun>=1.5.1",
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.14.11",
]
